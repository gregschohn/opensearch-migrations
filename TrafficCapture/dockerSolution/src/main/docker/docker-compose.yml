services:

  kafka:
    image: mirror.gcr.io/apache/kafka:3.9.1
    networks:
      - migrations
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://kafka:9092,PLAINTEXT://kafka:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: LogAppendTime
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

  elasticsearch:
    image: 'migrations/elasticsearch_searchguard:latest'
    networks:
      - migrations
    environment:
      - discovery.type=single-node
    ports:
      - '127.0.0.1:19200:9200'

  # The Rust proxy image ships no TLS material (the Java image had a shared self-signed key baked
  # in), so this init container generates a certificate once per stack into a volume the proxy
  # mounts read-only. See capture-proxy-dev-tls.sh. It borrows the Kafka image only because the
  # stack already pulls it and it carries openssl; root is needed to hand the key to the proxy's
  # unprivileged user.
  capture-proxy-tls:
    image: mirror.gcr.io/apache/kafka:3.9.1
    user: '0:0'
    network_mode: none
    volumes:
      - ./capture-proxy-dev-tls.sh:/capture-proxy-dev-tls.sh:ro
      - captureProxyTls:/tls
    entrypoint: ["/bin/sh", "/capture-proxy-dev-tls.sh", "/tls"]

  capture-proxy:
    image: 'migrations/capture_proxy:latest'
    networks:
      - migrations
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - captureProxyTls:/usr/share/captureProxy/config:ro
    command:
      - "--kafkaConnection"
      - "kafka:9092"
      - "--kafkaTopic"
      - "${KAFKA_TRAFFIC_TOPIC:-logging-traffic-topic}"
      - "--destinationUri"
      - "https://elasticsearch:9200"
      - "--insecureDestination"
      - "--listenPort"
      - "9200"
      - "--sslCertChainFile"
      - "/usr/share/captureProxy/config/pub.pem"
      - "--sslKeyFile"
      - "/usr/share/captureProxy/config/key.pem"
      - "--max-connection-duration-seconds"
      - "130"
      - "--heartbeat-interval-seconds"
      - "2"
    depends_on:
      capture-proxy-tls:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started

  opensearchtarget:
    image: 'mirror.gcr.io/opensearchproject/opensearch:2.15.0'
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=myStrongPassword123!
    networks:
      - migrations
    ports:
      - "127.0.0.1:29200:9200"

  replayer:
    image: 'migrations/traffic_replayer:latest'
    networks:
      - migrations
    volumes:
      - sharedLogsVolume:/shared-logs-output
    environment:
      - SHARED_LOGS_DIR_PATH=/shared-logs-output/traffic-replayer-default
    depends_on:
      kafka:
        condition: service_started
      opensearchtarget:
        condition: service_started
    command:
      - "--speedup-factor"
      - "2"
      # One replayer joins a fresh group here; the default one-minute startup quiet window only delays the first assignment.
      - "--kafka-quiet-window-ms"
      - "5000"
      - "--target-uri"
      - "https://opensearchtarget:9200"
      - "--target-username"
      - "admin"
      - "--target-password"
      - "myStrongPassword123!"
      - "--insecure"
      - "--kafka-traffic-brokers"
      - "kafka:9092"
      - "--kafka-traffic-topic"
      - "${KAFKA_TRAFFIC_TOPIC:-logging-traffic-topic}"
      - "--kafka-traffic-group-id"
      - "${KAFKA_TRAFFIC_GROUP_ID:-logging-group-default}"
      - "--request-filter-config"
      - >-
        {"JsonJMESPathPredicateProvider":{"script":"URI != '/_search/scroll'"}}
      - "--transformer-config"
      - '[{"TypeMappingSanitizationTransformerProvider":{"sourceProperties":{"version":{"major":7,"minor":10}}}}]'

  migration-console:
    image: 'migrations/migration_console:latest'
    networks:
      - migrations
    volumes:
      - sharedLogsVolume:/shared-logs-output
      - ./services.yaml:/config/migration_services.yaml
      - ~/.aws:/root/.aws
    environment:
      - MIGRATION_KAFKA_BROKER_ENDPOINTS=kafka:9092
      - AWS_PROFILE=default

volumes:
  sharedLogsVolume:
    driver: local
  captureProxyTls:
    driver: local

networks:
  migrations:
    driver: bridge
