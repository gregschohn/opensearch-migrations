receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  # Prometheus exposition so the harness can scrape a single text snapshot at
  # the end of the run. Cumulative counters and explicit histogram buckets are
  # what the harness needs: it differences the counters over the measured window
  # and reads the histogram buckets for kafkaCommitDuration percentiles.
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    metric_expiration: 30m
    resource_to_telemetry_conversion:
      enabled: true

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
